<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід - Lightbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Вхід у Lightbox 🔐</h1>
            
            <form id="loginForm" class="auth-form">
                <input type="text" id="username" class="auth-input" placeholder="Введіть логін" required autocomplete="off">
                <input type="password" id="password" class="auth-input" placeholder="Введіть пароль" required>
                <button type="submit" class="auth-btn">Увійти</button>
            </form>

            <p id="message" class="message"></p>
            
            <div class="switch-link">
                Ще немає корпоративного акаунту? <br><a href="/register.html">Створити акаунт</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const messageBox = document.getElementById('message');

        form.addEventListener('submit', async (event) => {
            event.preventDefault(); 
            
            const usernameValue = document.getElementById('username').value;
            const passwordValue = document.getElementById('password').value;
            const submitBtn = event.target.querySelector('button');

            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.7';

            try {
                const response = await fetch('/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: usernameValue,
                        password: passwordValue
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    messageBox.style.color = '#ef4444';
                    messageBox.innerText = data.error || 'Помилка входу';
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                } else {
                    messageBox.style.color = '#10b981';
                    messageBox.innerText = data.message || 'Успішний вхід!';
                    setTimeout(() => {
                        window.location.href = '/index.html'; 
                    }, 500);
                }
            } catch (error) {
                console.error('Помилка з\'єднання:', error);
                messageBox.style.color = '#ef4444';
                messageBox.innerText = 'Не вдалося з\'єднатися з сервером.';
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
