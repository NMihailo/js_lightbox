<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightbox - Адмін-панель</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container" style="max-width: 900px;">
        <div class="dashboard-header">
            <h1>Панель Адміністратора ⚙️</h1>
            <div>
                <button onclick="window.location.href='/index.html'" class="btn-primary" style="background-color: #6b7280; margin-right: 10px;">До файлів</button>
                <button id="logoutBtn" class="btn-logout">Вийти</button>
            </div>
        </div>

        <div class="files-card">
            <h2>Управління корпоративними лімітами</h2>
            <p style="color: #6b7280; margin-bottom: 20px; font-size: 14px;">Тут ви можете переглядати використання пам'яті співробітниками та керувати їхніми квотами.</p>
            
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Співробітник</th>
                        <th>Статус</th>
                        <th>Використано</th>
                        <th>Ліміт пам'яті</th>
                        <th>Дії з квотою</th>
                    </tr>
                </thead>
                <tbody id="users-tbody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const TEN_GB_IN_BYTES = 10737418240;

        function formatBytes(bytes) {
            if (bytes === 0 || !bytes) return '0 Байт';
            const k = 1024;
            const sizes = ['Байт', 'КБ', 'МБ', 'ГБ'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function loadUsers() {
            try {
                const response = await fetch('/api/admin/users');
                
                if (response.status === 403) {
                    alert('У вас немає прав адміністратора для перегляду цієї сторінки!');
                    window.location.href = '/index.html';
                    return;
                }
                
                const users = await response.json();
                const tbody = document.getElementById('users-tbody');
                tbody.innerHTML = '';

                users.forEach(user => {
                    const tr = document.createElement('tr');
                    const role = user.is_admin ? '<span style="color: #10b981; font-weight: bold;">🛡 Адмін</span>' : '👤 Співробітник';
                    const used = formatBytes(user.used_space);
                    const total = formatBytes(user.total_space);

                    tr.innerHTML = `
                        <td style="color: #6b7280;">#${user.id}</td>
                        <td><strong>${user.username}</strong></td>
                        <td>${role}</td>
                        <td>${used}</td>
                        <td style="font-weight: bold; color: #1f2937;">${total}</td>
                        <td style="display: flex; gap: 8px;">
                            <button class="btn-add-quota" onclick="changeQuota(${user.id}, ${user.total_space}, ${user.used_space}, '${user.username}', 1)">
                                +10 ГБ
                            </button>
                            <button class="btn-remove-quota" onclick="changeQuota(${user.id}, ${user.total_space}, ${user.used_space}, '${user.username}', -1)">
                                -10 ГБ
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Помилка завантаження користувачів:', error);
            }
        }

        async function changeQuota(userId, currentTotal, usedSpace, username, direction) {
            const amount = TEN_GB_IN_BYTES * direction;
            const newTotal = Number(currentTotal) + amount;

            if (direction === 1) {
                if (!confirm(`Точно виділити додаткові 10 ГБ для користувача ${username}?`)) return;
            } else {
                if (newTotal < Number(usedSpace)) {
                    alert(`❌ Неможливо забрати 10 ГБ! Користувач ${username} вже використав більше пам'яті, ніж залишиться після віднімання.`);
                    return;
                }
                if (newTotal <= 0) {
                    alert(`❌ Ліміт пам'яті не може бути нульовим або від'ємним!`);
                    return;
                }
                if (!confirm(`Точно забрати 10 ГБ у користувача ${username}?`)) return;
            }

            try {
                const response = await fetch(`/api/admin/users/${userId}/quota`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ new_total_space: newTotal })
                });

                if (response.ok) {
                    loadUsers();
                } else {
                    alert('Помилка при оновленні квоти');
                }
            } catch (error) {
                console.error(error);
            }
        }

        loadUsers();

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/api/users/logout', { method: 'POST' });
            window.location.href = '/login.html';
        });
    </script>
</body>
</html>
