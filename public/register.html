<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightbox - Реєстрація</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Створити акаунт 🚀</h1>
            <form id="registerForm" class="auth-form">
                <input type="text" id="username" class="auth-input" placeholder="Введіть логін" required autocomplete="off">
                <input type="password" id="password" class="auth-input" placeholder="Придумайте пароль" required>
                <button type="submit" class="auth-btn">Зареєструватися</button>
            </form>
            <p id="message" class="message"></p>
            
            <div class="switch-link">
                Вже маєте корпоративний акаунт? <br><a href="/login.html">Увійти в систему</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('message');
            const submitBtn = e.target.querySelector('button');

            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.7';
            messageEl.textContent = 'Створення акаунту...';
            messageEl.style.color = '#6b7280';

            try {
                const response = await fetch('/api/users/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    messageEl.style.color = '#10b981';
                    messageEl.textContent = data.message || 'Акаунт успішно створено!';
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 1000);
                } else {
                    messageEl.style.color = '#ef4444';
                    messageEl.textContent = data.error || 'Помилка реєстрації';
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                }
            } catch (error) {
                messageEl.style.color = '#ef4444';
                messageEl.textContent = 'Помилка з\'єднання із сервером';
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
